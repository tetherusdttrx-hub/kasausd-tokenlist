<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add KASAUSD to Web3 Wallet</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 32px; border-radius: 12px; text-align: center; max-width: 420px; border: 1px solid #334155; }
    button { background: #0ea5e9; color: #fff; border: none; padding: 14px 24px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 16px; width: 100%; }
    code { display: block; background: #020617; padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo-512.png?v=2" width="96" height="96" alt="KASAUSD" />
    <h2>KASAUSD (USDT.ks)</h2>
    <p>BNB Smart Chain (BEP-20) • 12 Decimals</p>
    <code>0xD62E58E9f3e6D5fCF59394C02ADcd83D19aE41aA</code>
    <button onclick="addToken()">+ Add KASAUSD to MetaMask / Web3 Wallet</button>
  </div>
  <script>
    async function addToken() {
      if (!window.ethereum) return alert("Open this page inside MetaMask, Trust Wallet, or OKX Wallet browser!");
      await window.ethereum.request({
        method: "wallet_watchAsset",
        params: {
          type: "ERC20",
          options: {
            address: "0xD62E58E9f3e6D5fCF59394C02ADcd83D19aE41aA",
            symbol: "USDT.ks",
            decimals: 12,
            image: "https://githubusercontent.com"
          }
        }
      });
    }
  </script>
</body>
</html>
